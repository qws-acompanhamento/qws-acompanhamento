function evidenceKey(unit,stage,tag,sub){return `${unit}|${stage}|${tag}|${sub}`}function evidenceActivityKey(unit,stage,tag){return `${unit}|${stage}|${tag}`}function evidenceSelectedTag(){return route.tag||document.getElementById('evidenceTag')?.value||''}function currentActivityEvidence(){const selectedTag=evidenceSelectedTag();if(!route.unit||route.stage===null||!selectedTag)return [];const items=loadEvidenceStore()[evidenceActivityKey(route.unit,route.stage,selectedTag)]||[];return Array.isArray(items)?items.filter(item=>item&&typeof item.base64==='string'&&item.base64.startsWith('data:image/')):[]}

function writeEvidenceToCloud(){if(!firebaseDb||!route.unit)return Promise.resolve(false);const store=loadEvidenceStore(),unitPrefix=`${route.unit}|`,unitStore={};Object.entries(store).forEach(([keyName,value])=>{if(keyName.startsWith(unitPrefix))unitStore[keyName.slice(unitPrefix.length)]=Array.isArray(value)?value:[]});console.log('[Firebase] sincronizando evidências:',route.unit,Object.keys(unitStore).length,'atividades');setConnection('Sincronizando...',true);return set(ref(firebaseDb,`permutograma/${route.unit}/evidencias`),unitStore).then(()=>{setConnection('Conectado',true);return true}).catch(error=>{console.error('[Firebase] erro ao salvar evidências:',error);setConnection('Desconectado',false);return false})}
function attachEvidenceListener(unit){if(!firebaseDb||firebaseListeners[`evidencias-${unit}`])return;const evidenceRef=ref(firebaseDb,`permutograma/${unit}/evidencias`);onValue(evidenceRef,snap=>{const incoming=snap.val()||{},store=loadEvidenceStore(),prefix=`${unit}|`,incomingKeys=new Set(Object.keys(incoming));Object.keys(store).filter(keyName=>keyName.startsWith(prefix)).forEach(keyName=>{if(!incomingKeys.has(keyName.slice(prefix.length)))delete store[keyName]});Object.entries(incoming).forEach(([keyName,value])=>{store[`${unit}|${keyName}`]=Array.isArray(value)?value:[]});console.log('[Firebase] evidências atualizadas:',unit,'atividades:',Object.keys(incoming).length);saveEvidenceStore(store);if(route.unit===unit){if(route.screen==='tag'||route.screen==='stage')render();else renderEvidenceGallery()}} ,error=>{console.error('[Firebase] erro ao ouvir evidências:',unit,error);setConnection('Desconectado',false)});firebaseListeners[`evidencias-${unit}`]=true}

function openEvidenceLightbox(src,alt){const lightbox=document.getElementById('evidenceLightbox'),image=document.getElementById('evidenceLightboxImage');if(!lightbox||!image)return;const dataUrl=typeof src==='string'&&src.trim().startsWith('data:image/')?src.trim():'';if(!dataUrl){flash('Não foi possível carregar esta evidência');return}image.src=dataUrl;image.alt=alt||'Evidência ampliada';lightbox.classList.add('open');document.body.classList.add('lightbox-open')}function detectEvidenceMime(bytes){if(bytes.length>=8&&bytes[0]===0x89&&bytes[1]===0x50&&bytes[2]===0x4e&&bytes[3]===0x47)return'image/png';if(bytes.length>=3&&bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff)return'image/jpeg';if(bytes.length>=6&&bytes[0]===0x47&&bytes[1]===0x49&&bytes[2]===0x46)return'image/gif';if(bytes.length>=12&&bytes[0]===0x52&&bytes[1]===0x49&&bytes[2]===0x46&&bytes[3]===0x46&&bytes[8]===0x57&&bytes[9]===0x45&&bytes[10]===0x42&&bytes[11]===0x50)return'image/webp';if(bytes.length>=2&&bytes[0]===0x42&&bytes[1]===0x4d)return'image/bmp';return'application/octet-stream'}function evidenceBase64ToBlob(dataUrl){if(typeof dataUrl!=='string')return null;const match=dataUrl.match(/^data:([^;,]+)?;base64,(.*)$/s);if(!match)return null;const raw=atob(match[2].replace(/\s/g,'')),bytes=new Uint8Array(raw.length);for(let index=0;index<raw.length;index++)bytes[index]=raw.charCodeAt(index);return new Blob([bytes],{type:match[1]||detectEvidenceMime(bytes)})}function openEvidenceInNewTab(dataUrl){const blob=evidenceBase64ToBlob(dataUrl);if(!blob){flash('Não foi possível abrir esta evidência');return}const objectUrl=URL.createObjectURL(blob),newTab=window.open(objectUrl,'_blank','noopener,noreferrer');if(!newTab){URL.revokeObjectURL(objectUrl);flash('Permita pop-ups para abrir a evidência');return}window.setTimeout(()=>URL.revokeObjectURL(objectUrl),60000)}function closeEvidenceLightbox(){const lightbox=document.getElementById('evidenceLightbox'),image=document.getElementById('evidenceLightboxImage');if(lightbox)lightbox.classList.remove('open');if(image)image.removeAttribute('src');document.body.classList.remove('lightbox-open')}function renderEvidenceGallery(){const gallery=document.getElementById('evidenceGallery');if(!gallery)return;const items=currentActivityEvidence();gallery.innerHTML=items.length?items.map((item,index)=>`<div class="evidence-item"><div class="evidence-meta"><span title="${escapeAttr(item.activity)} - ${formatEvidenceDate(item.date)} - ${escapeAttr(item.status||'Em Andamento')}">${escapeHTML(item.activity)} - ${formatEvidenceDate(item.date)} - ${escapeHTML(item.status||'Em Andamento')}</span><div class="evidence-actions"><a class="secondary evidence-open" href="#" data-evidence-open="${index}" aria-label="Abrir evidência em nova aba">Abrir</a><button type="button" class="secondary evidence-remove" data-evidence-index="${index}">Remover</button></div></div></div>`).join(''):'<p class="evidence-empty">Nenhuma evidência anexada.</p>';gallery.querySelectorAll('.evidence-meta span').forEach(info=>info.onclick=()=>{const item=items[Number(info.closest('.evidence-item')?.querySelector('[data-evidence-open]')?.dataset.evidenceOpen)];if(item)openEvidenceLightbox(item.base64,`${item.activity} - ${formatEvidenceDate(item.date)} - ${item.status||'Em Andamento'}`)});gallery.querySelectorAll('[data-evidence-open]').forEach(link=>link.onclick=event=>{event.preventDefault();const item=items[Number(link.dataset.evidenceOpen)];if(item)openEvidenceInNewTab(item.base64)});gallery.querySelectorAll('[data-evidence-index]').forEach(button=>button.onclick=()=>{const store=loadEvidenceStore(),keyName=evidenceActivityKey(route.unit,route.stage,evidenceSelectedTag()),items=Array.isArray(store[keyName])?store[keyName]:[],index=Number(button.dataset.evidenceIndex);if(index<0||index>=items.length)return;items.splice(index,1);if(items.length)store[keyName]=items;else delete store[keyName];console.log('[Evidência] remoção solicitada:',keyName,index);if(saveEvidenceStore function compressEvidenceImage(file,maxSize=1280,quality=.78){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Falha ao ler o arquivo'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('Falha ao decodificar a imagem'));image.onload=()=>{const scale=Math.min(1,maxSize/Math.max(image.naturalWidth||image.width,image.naturalHeight||image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((image.naturalWidth||image.width)*scale));canvas.height=Math.max(1,Math.round((image.naturalHeight||image.height)*scale));const context=canvas.getContext('2d');if(!context)return reject(new Error('Canvas indisponível'));context.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};image.src=String(reader.result)};reader.readAsDataURL(file)})}function addEvidence(){const cameraInput=document.getElementById('evidenceCamera'),galleryInput=document.getElementById('evidenceGalleryFile'),dateInput=document.getElementById('evidenceDate'),activityInput=document.getElementById('evidenceActivity'),statusInput=document.getElementById('evidenceStatus'),tagInput=document.getElementById('evidenceTag'),file=cameraInput?.files?.[0]||galleryInput?.files?.[0],date=dateInput?.value,activity=activityInput?.value,status=statusInput?.value||'Em Andamento',selectedTag=route.tag||tagInput?.value;console.log('[Evidência] início do upload',{name:file?.name,type:file?.type,size:file?.size,source:cameraInput?.files?.length?'câmera':galleryInput?.files?.length?'galeria':'nenhuma'});if(!file||!date||!activity||!selectedTag){flash('Selecione a atividade, uma foto e informe a data');console.warn('[Evidência] dados incompletos');return}if(!file.type.startsWith('image/')){flash('Selecione apenas arquivos de imagem');console.warn('[Evidência] tipo inválido:',file.type);return}flash('Processando foto...');compressEvidenceImage(file).then(base64=>{const store=loadEvidenceStore(),keyName=evidenceActivityKey(route.unit,route.stage,selectedTag),existing=Array.isArray(store[keyName])?store[keyName]:[];store[keyName]=[...existing,{base64,date,activity,status}];if(!saveEvidenceStore(store))return;if(cameraInput)cameraInput.value='';if(galleryInput)galleryInput.value='';dateInput.value='';statusInput.value='Em Andamento';renderEvidenceGallery();refreshTagEvidenceIndicator();return writeEvidenceToCloud()}).then(()=>console.log('[Evidência] upload concluído')).catch(error=>{console.error('[Evidência] falha no upload:',error);flash('Não foi possível processar a foto. Tente novamente.');})}

function hasEvidenceForTag(tag){if(!route.unit||route.stage===null||!tag)return false;const items=loadEvidenceStore()[evidenceActivityKey(route.unit,route.stage,tag)];return Array.isArray(items)&&items.some(item=>item&&typeof item.base64==='string'&&item.base64.startsWith('data:image/'))}function tagCard(tag){const items=stageSubs(route.stage,route.unit).map(sub=>getItem(route.stage,tag,sub));const done=items.filter(x=>x.status==='done').length,prog=items.filter(x=>x.status==='in-progress').length;const pct=Math.round(done/items.length*100);return `<article class="tag-card${prog>0?' in-progress':''}" data-tag="${tag}"><strong>${escapeHTML(tag)}${hasEvidenceForTag(tag)?'<span class="tag-evidence-indicator" title="Há evidências anexadas" aria-label="Há evidências anexadas">📎</span>':''}</strong><div class="tag-meta"><span>${done} concluídos</span><span>${prog} em andamento</span></div><div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div></article>`}
function tagHTML(){const st=STAGES[route.stage];return `<section class="view"><div class="toolbar"><div><button class="back" data-stage="${route.stage}">← ${st.name}</button><div class="hero" style="margin:0"><div><h2>${route.tag}</h2><p>Componentes editáveis da etapa selecionada.</p></div></div></div><span class="hint">Clique em um card para atualizar status</span></div><div class="component-grid">${stageSubs(route.stage,route.unit).map(sub=>componentCard(sub)).join('')}${evidenceCard()}</div></section>`}
function componentCard(sub){const item=getItem(route.stage,route.tag,sub);const inProgress=item.status==='in-progress';return `<article class="component-card${inProgress?' in-progress':''}" data-sub="${sub}"><div class="component-title">${sub}</div><div class="component-foot">${badge(item.status)}${item.notes?`<span class="notes" title="${escapeAttr(item.notes)}">${escapeHTML(item.notes)}</span>`:'<span class="notes">Sem observações</span>'}</div></article>`}function evidenceCard(){const st=STAGES[route.stage],activities=stageSubs(route.stage,route.unit).length?stageSubs(route.stage,route.unit):[st?.name||'Atividade da etapa'],tagSelector=!route.tag?`<div><label class="form-label" for="evidenceTag">TAG</label><select id="evidenceTag">${currentTags().map(tag=>`<option value="${escapeAttr(tag)}">${escapeHTML(tag)}</option>`).join('')}</select></div>`:'';return `<article class="component-card evidence-card" data-evidence-card><div class="component-title"><span>EVIDÊNCIAS</span><span class="hint">${route.tag?escapeHTML(route.tag):'Por TAG'}</span></div><div class="evidence-form">${tagSelector}<div><label class="form-label" for="evidenceActivity">Atividade</label><select id="evidenceActivity">${activities.map(sub=>`<option value="${escapeAttr(sub)}">${escapeHTML(sub)}</option>`).join('')}</select></div><div><label class="form-label" for="evidenceDate">Data da foto</label><input id="evidenceDate" type="date"></div><div><label class="form-label" for="evidenceStatus">Status</label><select id="evidenceStatus"><option value="Em Andamento" selected>Em Andamento</option><option value="Concluído">Concluído</option></select></div><div class="evidence-photo-actions"><label class="form-label">Fotos</label><div class="evidence-photo-buttons"><label class="secondary evidence-photo-button" for="evidenceCamera">📷 Tirar Foto</label><input id="evidenceCamera" type="file" accept="image/*" capture="environment"><label class="secondary evidence-photo-button" for="evidenceGalleryFile">🖼️ Adicionar Foto da Galeria</label><input id="evidenceGalleryFile" type="file" accept="image/*"></div></div><button class="secondary" type="button" id="addEvidence">Adicionar</button></div><div id="evidenceGallery" class="evidence-gallery" aria-live="polite"></div></article>`}function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function escapeAttr(v){return escapeHTML(v)}
function bind(){document.querySelectorAll('[data-zr]').forEach(el=>el.onclick=()=>{route.screen='zr';route.stage=7;route.tag=null;render()});document.getElementById('addEvidence')?.addEventListener('click',addEvidence);document.getElementById('evidenceTag')?.addEventListener('change',renderEvidenceGallery);renderEvidenceGallery();document.querySelectorAll('[data-torque]').forEach(el=>el.onclick=()=>{route.screen='torque';route.stage=STAGES.findIndex(st=>st.name==='Torque');route.tag=null;render()});document.getElementById('addZR')?.addEventListener('click',addZR);renderZRChart();document.getElementById('addTorque')?.addEventListener('click',addTorque);document.querySelectorAll('[data-zr-edit]').forEach(el=>el.onclick=()=>openZREditModal(Number(el.dataset.zrEdit)));document.querySelectorAll('[data-zr-delete]').forEach(el=>el.onclick=()=>deleteZR(Number(el.dataset.zrDelete)));document.querySelectorAll('[data-torque-edit]').forEach(el=>el.onclick=()=>editTorque(Number(el.dataset.torqueEdit)));document.querySelectorAll('[data-torque-delete]').forEach(el=>el.onclick=()=>deleteTorque(Number(el.dataset.torqueDelete)));document.querySelectorAll('[data-unit]').forEach(el=>el.onclick=()=>{route={screen:'home',unit:el.dataset.unit,stage:null,tag:null};data=loadData();render()});document.querySelectorAll('[data-menu]').forEach(el=>el.onclick=()=>{route={screen:'menu',unit:null,stage:null,tag:null};data={};render()});document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{route={screen:'stage',unit:route.unit,stage:Number(el.dataset.stage),tag:null};render()});document.querySelectorAll('[data-home]').forEach(el=>el.onclick=()=>{route={screen:'home',unit:route.unit,stage:null,tag:null};render()});document.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{route.screen='tag';route.tag=el.dataset.tag;render()});document.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>openEdit(el.dataset.sub));document.querySelectorAll('[data-summary]').forEach(el=>el.onclick=e=>openSummary(e.currentTarget.dataset.summary));document.querySelectorAll('[data-overall]').forEach(el=>el.onclick=e=>openOverallDetail(e.currentTarget.dataset.overall));document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>closeModal(el.dataset.close))}

function openZREditModal(index){const records=zrRecords(),record=records[index];if(!record)return;zrEditingIndex=index;fillZREditTags(record.tag||'');document.getElementById('zrEditDescription').value=zrEditValue(record);document.getElementById('zrEditDate').value=zrEditDateValue(record);document.getElementById('zrEditStartDate').value=zrEditStartDateValue(record);document.getElementById('zrEditStatus').value=normalizeZRStatus(record.status);zrEditModal.classList.add('open');document.getElementById('zrEditTag').focus()}
